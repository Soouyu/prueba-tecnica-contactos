spring.application.name=contactos

# Base de datos (PostgreSQL en Docker, puerto 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/contactos
spring.datasource.username=${DB_USER:contactos}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# configuracion paginas
spring.data.web.pageable.max-page-size=100

# jwt configuracion
app.jwt.secreto=${JWT_SECRET}
app.jwt.expiracion=${JWT_EXPIRACION:3600000}

# configuracion login
app.usuario=${APP_USUARIO}
app.clave=${APP_CLAVE}